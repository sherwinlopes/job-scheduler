spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/job_scheduler
    username: scheduler
    password: scheduler_pass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

scheduler:
  worker:
    enabled: true
  api:
    enabled: true
  poll-interval-ms: 5000
